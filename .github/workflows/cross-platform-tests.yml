name: Cross-platform tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.10", "3.12"]

    runs-on: ${{ matrix.os }}

    # pip prints "A new release of pip is available" on stderr, and GitHub
    # renders any stderr line from a step as an "Error:" annotation.  On the
    # Python 3.8 runners this fires inside setup-python's own pip upgrade, so
    # a green job still reports an error.  The notice carries no information
    # we act on: the next step upgrades pip anyway.
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q
